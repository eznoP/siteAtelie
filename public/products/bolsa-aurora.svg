<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 1200">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#d6a5b5"/><stop offset="1" stop-color="#6f3b55"/>
    </linearGradient>
    <linearGradient id="bag" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#f2b6c5"/><stop offset="1" stop-color="#b5476b"/>
    </linearGradient>
    <pattern id="stitch" width="30" height="24" patternUnits="userSpaceOnUse">
      <path d="M0 12 Q7 2 15 12 T30 12" fill="none" stroke="#ffe4e9" stroke-opacity=".58" stroke-width="5" stroke-linecap="round"/>
    </pattern>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="28" stdDeviation="24" flood-color="#321528" flood-opacity=".38"/>
    </filter>
    <filter id="grain">
      <feTurbulence baseFrequency=".8" numOctaves="2" seed="4" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0" result="mono"/>
      <feBlend in="SourceGraphic" in2="mono" mode="soft-light"/>
    </filter>
  </defs>
  <rect width="960" height="1200" fill="url(#bg)"/>
  <circle cx="132" cy="176" r="180" fill="#f3d9df" opacity=".32"/>
  <circle cx="838" cy="1020" r="260" fill="#442238" opacity=".3"/>
  <path d="M70 1080 C260 850 720 980 920 700" fill="none" stroke="#f1c8d2" stroke-width="8" opacity=".35"/>
  <g filter="url(#shadow)">
    <path d="M296 445 C302 238 658 238 665 445" fill="none" stroke="#8f3456" stroke-width="66" stroke-linecap="round"/>
    <path d="M313 445 C320 286 638 286 648 445" fill="none" stroke="#efacc0" stroke-width="18" stroke-linecap="round" opacity=".7"/>
    <path d="M198 454 Q480 390 762 454 L722 1002 Q480 1080 238 1002 Z" fill="url(#bag)"/>
    <path d="M198 454 Q480 390 762 454 L722 1002 Q480 1080 238 1002 Z" fill="url(#stitch)" opacity=".9"/>
    <path d="M205 470 Q480 408 755 470" fill="none" stroke="#782846" stroke-width="24" stroke-linecap="round"/>
    <path d="M252 974 Q480 1034 708 974" fill="none" stroke="#8f3456" stroke-width="12" opacity=".65"/>
  </g>
  <rect width="960" height="1200" fill="#8f4960" opacity=".12" filter="url(#grain)"/>
</svg>
